<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050914" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"

    <title>7x Workers Demand</title>
    <style>
      /* Cleared automatically once Vue mounts and replaces #app's content -
         scoped to its own element so it can't leak into the app's layout. */
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: rgba(255, 255, 255, 0.55);
        font-family: 'Noto Sans', sans-serif;
        font-size: 0.85rem;
        background: #050914;
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="app-loading">Loading...</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
