server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's stock mime.types has no .mjs entry, so it falls back to
    # application/octet-stream - strict browsers (Firefox) refuse to run a
    # module worker served with that type. maplibre-gl's worker needs this.
    location ~* \.mjs$ {
        default_type text/javascript;
    }

    # Vue Router uses history mode - unknown paths fall back to index.html
    # so client-side routing can take over instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
