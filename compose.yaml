services:
  postgres:
    image: postgres:17-alpine
    container_name: sevenx-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sevenx}
      POSTGRES_USER: ${POSTGRES_USER:-sevenx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sevenx_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sevenx} -d ${POSTGRES_DB:-sevenx}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    container_name: sevenx-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sevenx}:${POSTGRES_PASSWORD:-sevenx_dev}@postgres:5432/${POSTGRES_DB:-sevenx}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      OLLAMA_HEALTH_TIMEOUT_SECONDS: ${OLLAMA_HEALTH_TIMEOUT_SECONDS:-3}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
